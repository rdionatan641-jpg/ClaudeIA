name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extrair ZIP
        run: unzip ClaudeIA_APK.zip -d project

      - name: Listar arquivos
        run: ls -R project

      - name: Permissão Gradle
        run: |
          cd project
          chmod +x gradlew || true

      - name: Build APK
        run: |
          cd project
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: project/app/build/outputs/apk/debug/*.apk
 
